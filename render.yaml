# Render Blueprint: Render reads this file when you choose "New > Blueprint" and connect the repository.
services:
  - type: web
    name: holo-bid
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan
    healthCheckPath: /api/config
    disk:
      name: holobid-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /data/holobid.db
      - key: DEFAULT_CC
        value: "+972"
      - key: CONTACT_EMAIL     # shown on the privacy / terms pages
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: VAPID_SUBJECT
        sync: false
